# Copy to hosts.conf (git-ignored) and fill in. One [section] per physical machine;
# the section name is what you pass to remote.py. Several machines may share an OS.
#
# Keys, all optional except os / ssh / workspace / scratch:
#   os            windows | linux | macos
#   ssh           ssh target; key-based login must work
#                 (check: ssh -o BatchMode=yes <target> echo ok)
#   workspace     the project checkout on that machine — absolute, no spaces
#   scratch       scratch dir for pushed scripts, builds and results — absolute, no
#                 spaces, and one per project (see SKILL.md)
#   python        Python 3 on that machine (3.7+); every verb runs through it.
#                 Default: python3, or python on Windows. There, give the full path of a
#                 real python.exe with pythonw.exe beside it - not a Store alias or shim.
#   path_prepend  prepended to PATH; ';'-separated on Windows, ':'-separated elsewhere
#   display       Linux only: X display of the logged-on desktop session
#   default       yes = the one `remote.py <os> …` picks when that OS has several hosts
#
# A value runs to the end of the line minus a " #" comment, so Windows paths keep
# their backslashes and need no quoting. Keys set in [defaults] apply to every host.

[defaults]
python = python3

# --- Windows ------------------------------------------------------------------

[win-laptop]
os           = windows
ssh          = User@192.168.0.10
workspace    = D:\Projects\<org>\<repo>
scratch      = D:\tmp\claude-<project>
python       = C:\Python311\python.exe
default      = yes
# A concrete toolchain bin; not one going through %USERPROFILE%, and not a junction
# or symlink — those do not resolve over SSH. See references/windows.md.
path_prepend = C:\Users\<user>\.rustup\toolchains\stable-x86_64-pc-windows-msvc\bin

[win-arm]
os        = windows
ssh       = User@192.168.0.14
workspace = C:\Projects\<org>\<repo>
scratch   = C:\tmp\claude-<project>
python    = C:\Python311\python.exe

# --- Linux --------------------------------------------------------------------

[ubuntu-desktop]
os        = linux
ssh       = user@192.168.0.11
workspace = /home/user/Projects/<org>/<repo>
scratch   = /home/user/tmp/claude-<project>
display   = :0
default   = yes

[ubuntu-nuc]
os        = linux
ssh       = user@192.168.0.12
workspace = /home/user/Projects/<org>/<repo>
scratch   = /home/user/tmp/claude-<project>
display   = :0

# --- macOS --------------------------------------------------------------------

[mac-mini]
os        = macos
ssh       = user@192.168.0.13        # needs Remote Login (System Settings > General > Sharing)
workspace = /Users/user/Projects/<org>/<repo>
scratch   = /Users/user/tmp/claude-<project>
