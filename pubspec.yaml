name: beyondtranslate_workspace
publish_to: "none"
repository: https://github.com/beyondtranslate/beyondtranslate

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - apps/desktop/flutter
  - packages/runtime
  - packages/ui_flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      # packages/ui_flutter is vendored from upstream by scripts/sync_ui.py.
      # Upstream owns its lints as well as its formatting; holding it to this
      # repository's `--fatal-infos` bar would only show up as drift.
      run: melos exec -c 1 --ignore="beyondtranslate_ui" -- flutter analyze --fatal-infos
      description: Run `flutter analyze` for all packages.

    codegen:
      run: python3 scripts/codegen.py
      description: Regenerate Dart/Swift FFI bindings and macOS localization files.

    format:
      run: python3 scripts/format.py
      description: Format Dart, Rust, and Swift source files.

    format-check:
      run: python3 scripts/format.py --check
      description: Check formatting of Dart, Rust, and Swift source files.

    sync-ui:
      run: python3 scripts/sync_ui.py
      description: Re-vendor packages/ui_flutter from github.com/fastforgedev/ui.

    sync-ui-check:
      run: python3 scripts/sync_ui.py --check
      description: Fail if the vendored packages/ui_flutter has drifted from upstream.

    fix:
      exec: dart fix . --apply
      description: Run `dart fix` for all packages.

    test:
      exec: flutter test
      description: Run `flutter test` for all packages.

    dependency_validator:
      run: dart run dependency_validator -C apps/desktop/flutter
      description: Validate dependencies for workspace packages.
